# Deploy no Swarm pelo Komodo. Igual em todos os apps; a base é o template.
#
#   Procedure <app>-<ambiente>: Build → Deploy Stack, disparada pelo webhook do GitHub
#     (/listener/github/procedure/<app>-<ambiente>/<branch>).
#   Build: docker/dockerfile no builder do servidor, imagem local `azuos/<app>:<hash>-<ambiente>`.
#   Stack: docker/compose.yml no Swarm. Os segredos do Infisical entram só nas etapas de
#     docker/komodo.sh (pre-deploy, deploy e post-deploy).

[[build]]
name = "template-prod"
tags = ["context:apps", "env:core", "server:core"]
[build.config]
builder = "core"
git_provider = "github.com"
git_account = "grupo-azuos"
repo = "grupo-azuos/template"
branch = "main"
webhook_enabled = false
build_path = "template"
dockerfile_path = "docker/dockerfile"
image_name = "azuos/template"
image_tag = "prod"
include_latest_tag = false
include_version_tags = false
include_commit_tag = true

[[stack]]
name = "template-prod"
tags = ["context:apps", "env:core", "server:core"]
[stack.config]
swarm = "core-prod"
project_name = "template-prod"
git_provider = "github.com"
git_account = "grupo-azuos"
repo = "grupo-azuos/template"
branch = "main"
webhook_enabled = false
run_directory = "template"
file_paths = ["docker/compose.yml"]
extra_args = ["--resolve-image", "never", "--detach=false"]
pre_deploy.command = '''
INFISICAL_TOKEN='[[INFISICAL_PROD_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[TEMPLATE_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh pre-deploy template prod
'''
compose_cmd_wrapper_include = ["config", "deploy"]
compose_cmd_wrapper = '''
INFISICAL_TOKEN='[[INFISICAL_PROD_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[TEMPLATE_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh deploy template prod [[COMPOSE_COMMAND]]
'''
post_deploy.command = '''
INFISICAL_TOKEN='[[INFISICAL_PROD_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[TEMPLATE_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh post-deploy template prod
'''

[[procedure]]
name = "template-prod"
tags = ["context:apps", "env:core", "server:core"]
[procedure.config]
webhook_enabled = true

[[procedure.config.stage]]
name = "Build"
executions = [
  { execution.type = "RunBuild", execution.params.build = "template-prod" },
]

[[procedure.config.stage]]
name = "Deploy"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "template-prod" },
]

