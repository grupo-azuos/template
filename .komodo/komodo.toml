# Deploy no Komodo. Igual em todos os apps; a base é o template e a regra está na skill
# komodo-deploy. Nome de tudo: <ambiente>_<app> (homo_template, prod_template); o Docker completa
# os serviços com _<serviço> (homo_template_app, homo_template_gateway).
#
#   Repo       clone do repositório no servidor do ambiente; Build e Stack leem dele.
#   Build      docker/dockerfile no builder do ambiente: imagem local azuos/<app>:<hash>-<ambiente>.
#   Stack      docker/compose.yml no Swarm; o Infisical só entra nas etapas de docker/komodo.sh.
#   Procedure  Pull → Build → Deploy, disparada pelo webhook do GitHub
#              (/listener/github/procedure/<ambiente>_<app>/<branch>).
#   Action     rollback nativo do Swarm para a versão anterior.

# ── homo (develop) ───────────────────────────────────────────────────────────────────────────

[[repo]]
name = "homo_template"
description = "Clone da develop do template no homo"
tags = ["context:apps", "env:homo", "server:homo"]
[repo.config]
server = "homo"
git_provider = "github.com"
git_account = "grupo-azuos"
repo = "grupo-azuos/template"
branch = "develop"
webhook_enabled = false
links = ["https://github.com/grupo-azuos/template/tree/develop"]

[[build]]
name = "homo_template"
description = "Imagem azuos/template de homologação, construída no homo"
tags = ["context:apps", "env:homo", "server:homo"]
[build.config]
builder = "homo"
linked_repo = "homo_template"
webhook_enabled = false
build_path = "template"
dockerfile_path = "docker/dockerfile"
image_name = "azuos/template"
image_tag = "homo"
include_latest_tag = false
include_version_tags = false
include_commit_tag = true
labels = """
org.opencontainers.image.source=https://github.com/grupo-azuos/template
azuos.app=template
azuos.environment=homo
"""
links = ["https://template.homo.grupoazuos.com.br"]

[[stack]]
name = "homo_template"
description = "Serviços do template no Swarm do homo"
tags = ["context:apps", "env:homo", "server:homo"]
[stack.config]
swarm = "homo"
project_name = "homo_template"
linked_repo = "homo_template"
webhook_enabled = false
run_directory = "template"
file_paths = ["docker/compose.yml"]
extra_args = ["--resolve-image", "never", "--detach=false"]
links = ["https://template.homo.grupoazuos.com.br"]
pre_deploy.command = '''
INFISICAL_TOKEN='[[INFISICAL_HOMO_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[TEMPLATE_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh pre-deploy template homo
'''
compose_cmd_wrapper_include = ["config", "deploy"]
compose_cmd_wrapper = '''
INFISICAL_TOKEN='[[INFISICAL_HOMO_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[TEMPLATE_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh deploy template homo [[COMPOSE_COMMAND]]
'''
post_deploy.command = '''
INFISICAL_TOKEN='[[INFISICAL_HOMO_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[TEMPLATE_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh post-deploy template homo
'''

[[procedure]]
name = "homo_template"
description = "Publica a develop do template no homo: Pull, Build e Deploy"
tags = ["context:apps", "env:homo", "server:homo"]
[procedure.config]
webhook_enabled = true

[[procedure.config.stage]]
name = "Pull"
executions = [
  { execution.type = "PullRepo", execution.params.repo = "homo_template" },
]

[[procedure.config.stage]]
name = "Build"
executions = [
  { execution.type = "RunBuild", execution.params.build = "homo_template" },
]

[[procedure.config.stage]]
name = "Deploy"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "homo_template" },
]

[[action]]
name = "homo_template_rollback"
description = "Volta os serviços do homo_template para a versão anterior (rollback do Swarm)"
tags = ["context:apps", "env:homo", "server:homo"]
[action.config]
webhook_enabled = false
file_contents = '''
const stack = 'homo_template';
await komodo.execute_server_terminal(
  {
    server: 'homo',
    command: `docker service ls -q --filter label=com.docker.stack.namespace=${stack} | xargs -r -n1 docker service rollback --detach=false`,
    init: { command: 'sh' },
  },
  { onLine: (line) => console.log(line), onFinish: (code) => console.log(`exit ${code}`) },
);
'''

